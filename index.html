<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2: Score Analyzer</title>

	<!-- SETUP BOOTSTAP: link to Bootstrap -->

	<!-- link to JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<!-- Add style -->
	<link rel="stylesheet" type="text/css" href="style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="container">
		<h1 class="mt-4 mb-4">Score Analyzer</h1>
		<hr>
		<details>
			<summary>Instructions</summary>
			<p>Enter your grades for each subject then click the button to get your rating.</p>
		</details>
		<div class="row subs">
			<div class="col">
				<div class="card">
					<img src="sci.jpg" class="img-fluid">
					<h2 class="mt-3">Science</h2>
					<form>
						<input type="number" class="form-control" id="gradeSci">
					</form>
				</div>
			</div>
			<div class="col">
				<div class="card">
					<img src="math.jpg" class="img-fluid">
					<h2 class="mt-3">Math</h2>
					<form>
						<input type="number" class="form-control" id="gradeMath">
					</form>
				</div>
			</div>
			<div class="col">
				<div class="card">
					<img src="ss.jpeg" class="img-fluid">
					<h2 class="mt-3">Social Studies</h2>
					<form>
						<input type="number" class="form-control" id="gradeSocial">
					</form>
				</div>
			</div>
		</div>
		<button type="button" class="btn btn-light" onclick="average()">Get Rating</button>
		<button type="button" class="btn btn-light" onclick="window.location.reload()">Refresh</button>
		<script type="text/javascript" src="main.js"></script>
		<hr class="mt-3 mb-3">

				<div class="footer mb-3">
